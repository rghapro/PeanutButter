name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check if release assets already exist
        id: check_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$ASSETS" | grep -qx "PeanutButter.zip"; then
            echo "zip_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "zip_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$ASSETS" | grep -qx "PeanutButter.dmg"; then
            echo "dmg_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "dmg_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package PeanutButter.app, ZIP, and DMG
        if: steps.check_assets.outputs.zip_exists != 'true' || steps.check_assets.outputs.dmg_exists != 'true'
        run: |
          chmod +x ./build.sh ./scripts/make_dmg.sh
          ./build.sh --dmg
          codesign --verify --deep --strict PeanutButter.app
          ditto -c -k --sequesterRsrc --keepParent PeanutButter.app PeanutButter.zip

      - name: Create or update GitHub Release
        if: steps.check_assets.outputs.zip_exists != 'true' || steps.check_assets.outputs.dmg_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          TO_UPLOAD=()
          if ! printf '%s\n' "$ASSETS" | grep -qx "PeanutButter.zip"; then
            TO_UPLOAD+=("PeanutButter.zip")
          fi
          if ! printf '%s\n' "$ASSETS" | grep -qx "PeanutButter.dmg"; then
            TO_UPLOAD+=("PeanutButter.dmg")
          fi
          if [ "${#TO_UPLOAD[@]}" -eq 0 ]; then
            echo "All release assets already attached to $TAG; skipping upload."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${TO_UPLOAD[@]}"
          else
            gh release create "$TAG" "${TO_UPLOAD[@]}" --title "PeanutButter $TAG" --generate-notes
          fi
