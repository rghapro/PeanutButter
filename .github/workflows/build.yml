name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build release (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
